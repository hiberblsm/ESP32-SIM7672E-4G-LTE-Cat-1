; ESP32-S3 N16R8 (16MB Flash + 8MB Octal PSRAM)
; 06_SmsTest — SIM7672E bağımsız SMS test projesi
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash + 8MB octal PSRAM
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Yalnızca main.cpp ve 06_SmsTest kütüphanesi derlenir.
build_src_filter = +<main.cpp> +<06_SmsTest.cpp>

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
