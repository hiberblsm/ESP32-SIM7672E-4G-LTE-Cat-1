; ESP32-S3 N16R8 (16MB Flash + 8MB Octal PSRAM)
; 09_SmsTemperature — SIM7672E bağımsız SMS Sıcaklık Ölçüm projesi
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash + 8MB octal PSRAM
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; DS18B20 sıcaklık sensörü kütüphaneleri
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; Yalnızca main.cpp ve 09_SmsTemperature kütüphanesi derlenir.
build_src_filter = +<main.cpp> +<09_SmsTemperature.cpp>

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
